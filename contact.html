<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mario Samoilă | Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="brand-logo">~/mario_samoila</a>

            <button class="hamburger" aria-label="Meniu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-menu">
                <a href="index.html" class="nav-link">./acasă</a>
                <a href="about.html" class="nav-link">./despre</a>
                <a href="projects.html" class="nav-link">./proiecte</a>
                <a href="contact.html" class="nav-link active-page">./contact</a>
            </div>
        </nav>
    </header>

    <main class="container section-spacing">
        <h1 class="scroll-animate page-title">> contactează_mă</h1>

        <section class="scroll-animate card">
            <p class="card-subtitle">
                // Ai o întrebare sau o propunere de colaborare? Trimite-mi un mesaj mai jos.
            </p>

            <form id="contact-form" action="#" method="POST" novalidate class="contact-form">
                <div class="grid-2">
                    <div>
                        <label for="name" class="form-label">nume_complet *</label>
                        <input type="text" id="name" name="name" required placeholder="Ion Popescu" class="input-field">
                        <p id="name-error" class="error-text hidden"></p>
                    </div>

                    <div>
                        <label for="email" class="form-label">adresă_email *</label>
                        <input type="email" id="email" name="email" required placeholder="exemplu@domeniu.ro" class="input-field">
                        <p id="email-error" class="error-text hidden"></p>
                    </div>
                </div>

                <div class="grid-2">
                    <div>
                        <label for="phone" class="form-label">telefon (opțional)</label>
                        <input type="tel" id="phone" name="phone" placeholder="(0748) 523-672" class="input-field">
                        <p id="phone-error" class="error-text hidden"></p>
                    </div>

                    <div>
                        <label for="subject" class="form-label">subiect</label>
                        <input type="text" id="subject" name="subject" placeholder="Colaborare proiect..." class="input-field">
                    </div>
                </div>

                <div>
                    <div class="form-label-row">
                        <label for="message" class="form-label">mesaj *</label>
                        <span id="message-counter" class="char-counter">0 / 1000</span>
                    </div>
                    <textarea id="message" name="message" rows="5" required placeholder="Scrie mesajul tău aici (10 - 1000 caractere)..." class="input-field"></textarea>
                    <p id="message-error" class="error-text hidden"></p>
                </div>

                <div id="form-status" class="form-status hidden"></div>

                <div>
                    <button type="submit" class="btn btn-primary">
                        ./trimite_mesaj
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
